<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinod Vocab Vault AI has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://vinod-vocab-vault.web.app/">
  <noscript><meta http-equiv="refresh" content="0; url=https://vinod-vocab-vault.web.app/"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0F1117; color: #ECEEF4;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 16px; }
    a { color: #A99BFF; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:22px">Vinod Vocab Vault AI has moved</h1>
    <p>Taking you to <a id="go" href="https://vinod-vocab-vault.web.app/">vinod-vocab-vault.web.app</a>…</p>
  </main>
  <script>
    // The site moved from GitHub Pages to Firebase Hosting. Keep the same page and
    // query, and hand over this browser's saved data (words saved without signing in,
    // settings) in the URL fragment, which browsers never send to any server.
    (function () {
      var NEW = 'https://vinod-vocab-vault.web.app';
      var path = location.pathname.replace(/^\/Vocabulary-Vault/, '') || '/';
      if (path === '/index.html') path = '/';
      var target = NEW + path + location.search;
      try {
        var data = {}, any = false;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('vv_') === 0) { data[k] = localStorage.getItem(k); any = true; }
        }
        if (any) {
          var bytes = new TextEncoder().encode(JSON.stringify(data));
          var bin = '';
          for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
          target += '#vv-migrate=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
      } catch (e) { /* storage blocked: just redirect */ }
      document.getElementById('go').href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
